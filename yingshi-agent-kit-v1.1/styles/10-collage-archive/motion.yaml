# 包 A 动效词汇表：动作 → GSAP 参数
# 规则：入场一律 steps()，禁止 bounce.out / elastic.out / 无限循环
version: 1
style: collage-archive
units: seconds

global:
  entry_ease: "steps(7)"          # 手撕纸片的默认手感
  entry_duration: 0.6
  step_size: 2                    # cutting on twos
  camera_push:                    # 成型后的唯一"活着"的动作
    property: scale
    from: 1.0
    to: 1.014
    ease: "power1.inOut"
    duration: 3.9
    delay_after: 0.3              # 相对最后一个标注动作

actions:
  settle_base:                    # 底纸落定
    tween: { autoAlpha: [0, 1], scale: [1.05, 1] }
    ease: "power2.out"
    duration: 0.7
  slide_in_left:                  # 纸片从左滑入
    tween: { autoAlpha: [0, 1], x: [-170, 0] }
    ease: "steps(7)"
    duration: 0.6
  drop_in_top:                    # 纸片从上落下
    tween: { autoAlpha: [0, 1], y: [-150, 0] }
    ease: "steps(7)"
    duration: 0.6
  hero_land:                      # 主图落位（带一点放大回收）
    tween: { autoAlpha: [0, 1], x: [280, 0], scale: [1.07, 1] }
    ease: "steps(9)"
    duration: 0.78
  tape_press:                     # 胶带下压
    tween: { autoAlpha: [0, 1], scaleY: [0, 1] }
    transformOrigin: "50% 0%"
    ease: "steps(3)"
    duration: 0.3
  label_slide:                    # 标签条滑入
    tween: { autoAlpha: [0, 1], x: [-150, 0] }
    ease: "steps(6)"
    duration: 0.5
  stamp_slap:                     # 印章拍下
    tween: { autoAlpha: [0, 1], scale: [1.7, 1], rotation: [-18, -6] }
    transformOrigin: "50% 50%"
    ease: "steps(4)"
    duration: 0.34
  pin_drop:                       # 图钉落位
    tween: { autoAlpha: [0, 1], scale: [1.9, 1] }
    transformOrigin: "50% 50%"
    ease: "steps(3)"
    duration: 0.22
  string_draw:                    # 红绳拉过去（用 scaleX 揭示，不用 stroke-dashoffset）
    tween: { scaleX: [0, 1] }
    transformOrigin: "0% 50%"
    ease: "steps(7)"
    duration: 1.15
  marker_underline:               # 马克笔下划线
    tween: { scaleX: [0, 1] }
    transformOrigin: "0% 50%"
    ease: "steps(5)"
    duration: 0.45

constraints:
  max_elements: 8
  min_gap_between_labels: 0.4
  banned_eases: ["bounce.out", "elastic.out"]
  banned: [repeat_infinite, idle_float, breathe, glow_pulse]
