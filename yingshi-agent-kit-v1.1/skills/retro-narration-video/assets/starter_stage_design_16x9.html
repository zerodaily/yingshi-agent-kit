<!doctype html>
<!-- 画风包 B（设计拼贴）横屏派生模板：1920×1080 / 12s / 30fps
     复制到项目根目录后，需同时具备：assets/design_*.png、assets/vendor/gsap.min.js -->
<html lang="zh" data-resolution="landscape">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <style>
      @font-face { font-family: "TypeCN"; src: local("Microsoft YaHei"); }
      @font-face { font-family: "Deck"; src: local("Arial Black"); }
      @font-face { font-family: "DeckAlt"; src: local("Impact"); }

      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #6d2f19; }
      #root { position: relative; width: 1920px; height: 1080px; overflow: hidden; }
      .clip { position: absolute; inset: 0; overflow: hidden; }
      .stage { position: absolute; inset: 0; width: 1920px; height: 1080px; }

      .field { position: absolute; inset: 0; background: #cf5a2c; }
      .field::after {
        content: ""; position: absolute; inset: 0; opacity: .16; mix-blend-mode: multiply;
        background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='3'/></filter><rect width='240' height='240' filter='url(%23n)' opacity='0.65'/></svg>");
      }
      .field-shade {
        position: absolute; inset: 0;
        background: radial-gradient(120% 90% at 62% 40%, rgba(255, 214, 170, .16), rgba(90, 30, 8, .30) 78%);
      }

      .card { position: absolute; left: 620px; top: 200px; width: 1200px; height: 700px; background: #f4ead6; box-shadow: 12px 16px 34px rgba(58, 24, 6, .34); }
      .strip { position: absolute; left: 620px; top: 192px; width: 1200px; height: 20px; background: #d9a441; box-shadow: 0 4px 10px rgba(58, 24, 6, .28); }
      .chip { position: absolute; left: 1728px; top: 112px; width: 128px; height: 128px; background: #2f7f7a; box-shadow: 8px 10px 22px rgba(58, 24, 6, .30); }

      .cut { position: absolute; display: block; filter: drop-shadow(6px 8px 14px rgba(52, 22, 6, .34)); }
      .cut-hero { left: 760px;  top: 420px; width: 800px; z-index: 5; }
      .cut-por  { left: 656px;  top: 250px; width: 300px; z-index: 4; }
      .cut-mini { left: 1420px; top: 232px; width: 260px; z-index: 4; }

      .head { position: absolute; left: 92px; top: 272px; z-index: 8; }
      .head .w {
        font-family: "Deck", "DeckAlt", sans-serif; font-size: 176px; line-height: 1.16;
        letter-spacing: 2px; color: #f7efdd; display: block; text-shadow: 5px 6px 0 rgba(90, 30, 8, .28);
      }
      .rule { position: absolute; left: 94px; top: 716px; width: 348px; height: 8px; background: #f4ead6; opacity: .88; z-index: 8; }
      .subline { position: absolute; left: 94px; top: 756px; z-index: 8; background: #f4ead6; padding: 14px 26px 18px; box-shadow: 8px 10px 22px rgba(58, 24, 6, .30); }
      .subline .cn { font-family: "TypeCN", sans-serif; font-weight: 700; font-size: 56px; line-height: 1.2; letter-spacing: 3px; color: #221d16; display: block; }
      .foot { position: absolute; left: 96px; top: 918px; z-index: 8; font-family: "TypeCN", sans-serif; font-size: 32px; line-height: 1.3; letter-spacing: 6px; color: rgba(255, 240, 214, .82); }
      .tick { position: absolute; width: 44px; height: 44px; border: 5px solid #f4ead6; opacity: .8; z-index: 8; }
      .tick.a { left: 40px; top: 40px; border-right: none; border-bottom: none; }
      .tick.b { right: 40px; bottom: 40px; border-left: none; border-top: none; }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="12"
      data-width="1920"
      data-height="1080"
    >
      <section id="scene-design-16x9" class="clip" data-start="0" data-duration="12" data-track-index="1">
        <div class="stage" id="stage">
          <div class="field" id="field"><div class="field-shade"></div></div>

          <div class="card" id="card"></div>
          <div class="strip" id="strip"></div>
          <div class="chip" id="chip"></div>

          <img class="cut cut-por"  id="cutPor"  src="assets/design_portrait.png" alt="" />
          <img class="cut cut-mini" id="cutMini" src="assets/design_mini.png" alt="" />
          <img class="cut cut-hero" id="cutHero" src="assets/design_saab96.png" alt="" />

          <div class="head" id="head">
            <span class="w" id="w1">SAAB</span>
            <span class="w" id="w2">96</span>
          </div>
          <div class="rule" id="rule"></div>
          <div class="subline" id="subline"><span class="cn">1962 蒙特卡洛</span></div>
          <div class="foot" id="foot">档案拼贴 · 设计版</div>
          <div class="tick a" id="tickA"></div>
          <div class="tick b" id="tickB"></div>
        </div>
      </section>
    </div>

    <script src="assets/vendor/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      tl.fromTo("#field", { autoAlpha: 0, scale: 1.03 },
        { autoAlpha: 1, scale: 1, duration: .7, ease: "power2.out", transformOrigin: "50% 50%" }, 0.15);
      tl.fromTo("#card", { autoAlpha: 0, x: 150 },
        { autoAlpha: 1, x: 0, duration: .6, ease: "steps(6)" }, 0.70);
      tl.fromTo("#strip", { scaleX: 0 },
        { scaleX: 1, duration: .28, ease: "steps(4)", transformOrigin: "0% 50%" }, 1.25);
      tl.fromTo("#chip", { autoAlpha: 0, scale: 1.6, rotation: -8 },
        { autoAlpha: 1, scale: 1, rotation: 0, duration: .34, ease: "back.out(1.5)", transformOrigin: "50% 50%" }, 1.75);

      tl.fromTo("#cutHero", { autoAlpha: 0, x: 210, scale: 1.06 },
        { autoAlpha: 1, x: 0, scale: 1, duration: .7, ease: "steps(8)" }, 2.40);
      tl.fromTo("#cutPor", { autoAlpha: 0, y: -160 },
        { autoAlpha: 1, y: 0, duration: .6, ease: "steps(7)" }, 3.50);
      tl.fromTo("#cutMini", { autoAlpha: 0, y: 130 },
        { autoAlpha: 1, y: 0, duration: .55, ease: "steps(6)" }, 4.35);

      tl.fromTo("#w1", { autoAlpha: 0, y: 60 },
        { autoAlpha: 1, y: 0, duration: .45, ease: "steps(5)" }, 5.20);
      tl.fromTo("#w2", { autoAlpha: 0, y: 60 },
        { autoAlpha: 1, y: 0, duration: .45, ease: "steps(5)" }, 5.58);
      tl.fromTo("#rule", { scaleX: 0 },
        { scaleX: 1, duration: .4, ease: "steps(4)", transformOrigin: "0% 50%" }, 6.20);
      tl.fromTo("#subline", { autoAlpha: 0, x: -120 },
        { autoAlpha: 1, x: 0, duration: .5, ease: "steps(5)" }, 6.60);
      tl.fromTo("#foot", { autoAlpha: 0 },
        { autoAlpha: 1, duration: .4, ease: "steps(4)" }, 7.20);
      tl.fromTo("#tickA", { autoAlpha: 0, scale: 1.5 },
        { autoAlpha: 1, scale: 1, duration: .25, ease: "steps(3)", transformOrigin: "0% 0%" }, 7.60);
      tl.fromTo("#tickB", { autoAlpha: 0, scale: 1.5 },
        { autoAlpha: 1, scale: 1, duration: .25, ease: "steps(3)", transformOrigin: "100% 100%" }, 7.90);

      tl.fromTo("#stage", { scale: 1 },
        { scale: 1.012, duration: 3.7, ease: "power1.inOut", transformOrigin: "54% 46%" }, 8.30);

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
