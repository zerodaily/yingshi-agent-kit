<!doctype html>
<html lang="zh" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>动态纸墨 v2 · 原生竖屏项目壳</title>
    <style>
      @font-face { font-family: "PaperKai"; src: local("KaiTi"); }
      @font-face { font-family: "PaperSerif"; src: local("SimSun"); }
      @font-face { font-family: "PaperSans"; src: local("Microsoft YaHei"); }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #e7d7b8; }
      #root {
        position: relative; width: 1080px; height: 1920px; overflow: hidden;
        background: #e7d7b8;
      }
      .stage-ground {
        position: absolute; inset: 0; z-index: 0;
        background:
          radial-gradient(circle at 18% 12%, rgba(255,255,255,.38), rgba(255,255,255,0) 31%),
          linear-gradient(180deg, #eadbbd, #dfcda9 58%, #efe3c8);
      }
      .scene-host { position: absolute; inset: 0; z-index: 2; }
      .seal {
        position: absolute; right: 42px; bottom: 64px; z-index: 20;
        width: 90px; height: 90px; display: grid; place-items: center;
        background: #b8341c; color: #f8f1de; font-family: "PaperKai", serif;
        font-size: 30px; line-height: 1.05; text-align: center;
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0"
         data-duration="18" data-width="1080" data-height="1920">
      <div class="stage-ground"></div>

      <div id="v01" class="scene-host" data-composition-id="v01"
           data-composition-src="compositions/v01_opening.html"
           data-start="0" data-duration="6" data-track-index="1"
           data-width="1080" data-height="1920" data-track-kind="graphics"></div>

      <div id="v02" class="scene-host" data-composition-id="v02"
           data-composition-src="compositions/v02_split.html"
           data-start="6" data-duration="6" data-track-index="1"
           data-width="1080" data-height="1920" data-track-kind="graphics"></div>

      <div id="v03" class="scene-host" data-composition-id="v03"
           data-composition-src="compositions/v03_evidence.html"
           data-start="12" data-duration="6" data-track-index="1"
           data-width="1080" data-height="1920" data-track-kind="graphics"></div>

      <div class="seal">言同学</div>
    </div>
    <script src="assets/vendor/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
