<!doctype html>
<html lang="zh" data-resolution="landscape">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>动态纸墨 v2 · 项目壳</title>
    <style>
      @font-face { font-family: "PaperKai"; src: local("KaiTi"); }
      @font-face { font-family: "PaperSerif"; src: local("SimSun"); }
      @font-face { font-family: "PaperSans"; src: local("Microsoft YaHei"); }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 1920px; height: 1080px; overflow: hidden;
        background: #e7d7b8;
      }
      #root {
        position: relative; width: 1920px; height: 1080px; overflow: hidden;
        background: #e7d7b8;
      }
      .stage-ground {
        position: absolute; inset: 0; z-index: 0;
        background:
          radial-gradient(circle at 15% 16%, rgba(255,255,255,.38), rgba(255,255,255,0) 34%),
          linear-gradient(90deg, #eadbbd, #e3d1af 54%, #efe3c8);
      }
      .stage-ground::after {
        content: ""; position: absolute; inset: 0; opacity: .12;
        mix-blend-mode: multiply;
        background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='260' height='260'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.86' numOctaves='3'/></filter><rect width='260' height='260' filter='url(%23n)' opacity='.62'/></svg>");
      }
      .scene-host {
        position: absolute; inset: 0; z-index: 2;
      }
      .seal {
        position: absolute; right: 58px; bottom: 48px; z-index: 20;
        width: 92px; height: 92px; display: grid; place-items: center;
        background: #b8341c; color: #f8f1de; font-family: "PaperKai", serif;
        font-size: 31px; line-height: 1.05; text-align: center;
        box-shadow: 2px 3px 8px rgba(0,0,0,.18);
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0"
         data-duration="18" data-width="1920" data-height="1080">
      <div class="stage-ground"></div>

      <div id="s01" class="scene-host" data-composition-id="s01"
           data-composition-src="compositions/s01_opening.html"
           data-start="0" data-duration="6" data-track-index="1"
           data-width="1920" data-height="1080" data-track-kind="graphics"></div>

      <div id="s02" class="scene-host" data-composition-id="s02"
           data-composition-src="compositions/s02_split.html"
           data-start="6" data-duration="6" data-track-index="1"
           data-width="1920" data-height="1080" data-track-kind="graphics"></div>

      <div id="s03" class="scene-host" data-composition-id="s03"
           data-composition-src="compositions/s03_evidence.html"
           data-start="12" data-duration="6" data-track-index="1"
           data-width="1920" data-height="1080" data-track-kind="graphics"></div>

      <div class="seal">言同学</div>
    </div>

    <script src="assets/vendor/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
