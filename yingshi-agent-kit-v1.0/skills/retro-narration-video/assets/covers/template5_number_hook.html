<!doctype html>
<!-- 封面模板5 · 数字钩子款：巨号数字 + 车人同框场景 -->
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="common.css">
  <style>
    .brand {
      position: absolute; top: 54px; left: 74px; z-index: 8;
      font-size: 112px; font-weight: bold; letter-spacing: 12px;
    }
    .kicker {
      position: absolute; top: 184px; left: 78px; z-index: 8;
      font-family: "ChineseSerif", serif; font-size: 34px;
      letter-spacing: 5px; color: #b8341c;
    }
    .number {
      position: absolute; left: 70px; top: 280px; z-index: 8;
      font-family: "ChineseSerif", serif; font-size: 390px;
      font-weight: 900; line-height: .82; color: #b8341c;
    }
    .unit {
      position: absolute; left: 92px; top: 640px; z-index: 8;
      font-family: "ChineseKai", serif; font-size: 62px;

    }

      position: absolute; left: 88px; bottom: 120px; width: 520px; z-index: 8;
      font-family: "ChineseKai", serif; font-size: 54px; line-height: 1.35;
    }
    .hero {
      position: absolute; right: 58px; top: 232px; width: 900px; height: 880px;
      z-index: 6;
    }

</head>

  <div class="cover">
    <div class="brand">沃尔沃</div>

    <div class="unit">元专利费</div>
    <div class="hook">一根带子<br>救了上百万人</div>
    <div class="hero">
      <div class="ph">撕边纸卡内：黑白半调车 + 黑线稿言同学<br>cover_hero.png</div>
    </div>
    <div class="seal br">言同学</div>
  </div>
</body>
</html>
