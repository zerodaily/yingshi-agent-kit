<!doctype html>
<html lang="zh" data-resolution="landscape">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face { font-family: "ChineseSans"; src: local("Microsoft YaHei"); }
      @font-face { font-family: "ChineseSerif"; src: local("SimSun"); }
      @font-face { font-family: "ChineseKai"; src: local("KaiTi"); }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #101010; }
      #root { position: relative; width: 1920px; height: 1080px; overflow: hidden; }
      .clip { position: absolute; inset: 0; overflow: hidden; }
      .bg { position: absolute; inset: 0; background: #f2e8d3; }
      .bg::after {
        content: ""; position: absolute; inset: 0; pointer-events: none; opacity: .1;
        background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2'/></filter><rect width='240' height='240' filter='url(%23n)' opacity='0.55'/></svg>");
        mix-blend-mode: multiply;
      }
      .inner {
        position: relative; width: 100%; height: 100%;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        text-align: center; padding: 110px 170px;
      }
      .artplate {
        width: 540px; height: 540px; padding: 14px; margin-bottom: 34px; flex: none;
        background: #f8f1de; border: 4px solid #7a5c33;
        outline: 1px solid #cbb98d; outline-offset: -9px;
        box-shadow: 0 10px 34px rgba(52, 37, 16, 0.22);
      }
      .artplate img { display: block; width: 504px; height: 504px; object-fit: cover; filter: sepia(.18) saturate(.92); }
      .title { font-family: "ChineseKai", "ChineseSerif", serif; font-size: 92px; line-height: 1.18; color: #241b10; }
      .sub { font-family: "ChineseSerif", serif; font-size: 44px; margin-top: 20px; color: #33281a; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="6" data-width="1920" data-height="1080">
      <audio id="narration" src="口播拼接.wav" data-start="0" data-duration="6"></audio>
      <section id="s1-demo" class="clip" data-start="0" data-duration="6" data-track-index="1">
        <div class="bg"></div>
        <div class="inner" id="s1-inner">
          <div class="artplate"><img src="assets/illustrations/demo_2048.png" alt="" /></div>
          <div class="title">示例标题：每一画面一张配图</div>
          <div class="sub">文字用 HTML 叠加，保持清晰</div>
        </div>
      </section>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      tl.from("#s1-inner", { opacity: 0, y: 46, duration: 1, ease: "power2.out" }, 0.25);
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
