<!doctype html>
<!-- 封面模板4 · 对比款：米黄纸底与深墨绿对比场景，老车 vs 新车，言同学在中间指两边 -->
<html lang="zh">
<head><meta charset="UTF-8"><link rel="stylesheet" href="common.css">
<style>
  .split { position: absolute; top: 70px; bottom: 70px; left: 70px; right: 70px;
           border: 8px solid #1b1b1a; }
  .split img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .tag-left, .tag-right { position: absolute; top: 98px; z-index: 5;
                          background: #1b1b1a; color: #ffffff; font-size: 44px;
                          padding: 8px 26px; letter-spacing: 8px; }
  .tag-left { left: 98px; }
  .tag-right { right: 98px; }
  .mid { position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%);
         z-index: 10; text-align: center; }
  .mid .vs { background: #d64b3c; color: #ffffff; font-size: 72px; font-weight: bold;
             width: 150px; height: 150px; border-radius: 50%;
             display: flex; align-items: center; justify-content: center;
             border: 6px solid #f2e8d3; box-shadow: 0 6px 24px rgba(0,0,0,.3); }
  .mid .brand { margin-top: 18px; background: #ffffff; border: 4px solid #1b1b1a;
                font-size: 56px; font-weight: bold; letter-spacing: 10px;
                padding: 10px 28px; white-space: nowrap; }
  .yctx-note { position: absolute; bottom: 100px; left: 0; right: 0; text-align: center;
               font-size: 34px; color: #1b1b1a; }
</style></head>
<body>
<div class="cover">
  <div class="split">
    <div class="ph" style="width:100%;height:100%;border:none;">米黄纸底 + 深墨绿老车/新车 + 中间言同学<br>cover_compare.png</div>
  </div>
  <div class="tag-left">老车</div>
  <div class="tag-right">新车</div>
  <div class="mid">
    <div class="vs">VS</div>
    <div class="brand">日产 NISSAN</div>
  </div>
  <!-- 人物、老车、新车必须在同一张场景图里；prompt 见 references/cover-ip-prompt.md -->
  <div class="yctx-note">人物在同一个人物层里指向两边</div>
  <div class="seal br">言同学</div>
</div>
</body>
</html>
